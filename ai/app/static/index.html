<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Mastery - Learning Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #404040;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-inverse: #1a1a1a;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #404040;
            --sidebar-bg: #1e1e1e;
            --sidebar-accent: #2a2a2a;
            --content-bg: #262626;
            --message-user-bg: #3498db;
            --message-assistant-bg: #333333;
            --code-bg: #1e1e1e;
            --code-text: #e0e0e0;
        }

        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-inverse: #ffffff;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e0e0e0;
            --sidebar-bg: #2c3e50;
            --sidebar-accent: #34495e;
            --content-bg: #ffffff;
            --message-user-bg: #3498db;
            --message-assistant-bg: #ffffff;
            --code-bg: #f4f4f4;
            --code-text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            height: 100vh;
            display: flex;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }

        .chat-section {
            padding: 20px;
            border-bottom: 2px solid var(--border);
            background: var(--sidebar-accent);
        }

        .chat-toggle {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .chat-toggle:hover {
            background: var(--accent-hover);
        }

        .chat-toggle.active {
            background: #e74c3c;
        }

        .lessons-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .lessons-title {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .lesson-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: var(--sidebar-accent);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lesson-item:hover {
            background: var(--accent);
            transform: translateX(5px);
        }

        .lesson-item.active {
            background: var(--accent);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--content-bg);
            overflow: hidden;
        }

        .content-header {
            padding: 20px 30px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .content-body {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .chat-container {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message.user .message-bubble {
            background: var(--message-user-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: var(--message-assistant-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        .chat-input-container {
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .send-button {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .send-button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lesson-content {
            display: none;
        }

        .lesson-content.active {
            display: block;
        }

        .lesson-content h1 {
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
        }

        .lesson-content h2 {
            color: var(--text-primary);
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .lesson-content h3 {
            color: var(--text-primary);
            margin-top: 25px;
            margin-bottom: 12px;
        }

        .lesson-content p {
            line-height: 1.8;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .lesson-content ul, .lesson-content ol {
            margin-left: 30px;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .lesson-content code {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
        }

        .lesson-content pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .lesson-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        .lesson-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 20px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .welcome-message h1 {
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .welcome-message p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="chat-section">
            <button class="chat-toggle" onclick="toggleChat()">Open Chat Assistant</button>
        </div>
        <div class="lessons-section">
            <h3 class="lessons-title">Available Lessons</h3>
            <div id="lessonsList"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="content-header">
            <h1 id="contentTitle">Welcome to Python Mastery</h1>
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="themeIcon">☀️</span>
                <span id="themeText">Light Mode</span>
            </button>
        </div>
        <div class="content-body">
            <div class="welcome-message" id="welcomeContent">
                <h1>Welcome to the Learning Platform</h1>
                <p>Select a lesson from the sidebar to begin learning, or open the chat assistant to ask questions.</p>
            </div>
            <div class="lesson-content" id="lessonContent"></div>
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="Type your message here..."
                        onkeypress="handleKeyPress(event)"
                    />
                    <button class="send-button" id="sendButton" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentView = 'welcome';
        let currentLessonId = null;
        let isLoading = false;

        async function loadLessons() {
            try {
                const response = await fetch('/api/lessons');
                const data = await response.json();
                const lessonsList = document.getElementById('lessonsList');
                
                lessonsList.innerHTML = '';
                data.lessons.forEach(lesson => {
                    const lessonItem = document.createElement('div');
                    lessonItem.className = 'lesson-item';
                    lessonItem.textContent = lesson.title;
                    lessonItem.onclick = () => loadLesson(lesson.id, lesson.title);
                    lessonItem.dataset.lessonId = lesson.id;
                    lessonsList.appendChild(lessonItem);
                });
            } catch (error) {
                console.error('Error loading lessons:', error);
            }
        }

        async function loadLesson(lessonId, title) {
            if (currentView === 'chat') {
                toggleChat();
            }
            
            document.querySelectorAll('.lesson-item').forEach(item => {
                item.classList.remove('active');
            });
            
            document.querySelector(`[data-lesson-id="${lessonId}"]`).classList.add('active');
            
            try {
                const response = await fetch(`/api/lessons/${lessonId}`);
                const data = await response.json();
                
                document.getElementById('contentTitle').textContent = title;
                document.getElementById('welcomeContent').style.display = 'none';
                document.getElementById('lessonContent').innerHTML = parseMarkdown(data.content);
                document.getElementById('lessonContent').classList.add('active');
                
                currentView = 'lesson';
                currentLessonId = lessonId;
            } catch (error) {
                console.error('Error loading lesson:', error);
            }
        }

        function parseMarkdown(markdown) {
            let html = markdown;
            
            html = html.replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>');
            
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
            
            html = html.replace(/^\* (.*$)/gim, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul>\n<ul>/g, '');
            
            html = html.replace(/^\d+\. (.*$)/gim, '<ol><li>$1</li></ol>');
            html = html.replace(/<\/ol>\n<ol>/g, '');
            
            const paragraphs = html.split('\n\n');
            html = paragraphs.map(para => {
                if (para.startsWith('<h') || para.startsWith('<ul') || para.startsWith('<ol') || 
                    para.startsWith('<blockquote') || para.startsWith('<pre')) {
                    return para;
                }
                return para.trim() ? `<p>${para}</p>` : '';
            }).join('\n');
            
            return html;
        }

        function toggleChat() {
            const chatToggle = document.querySelector('.chat-toggle');
            const chatContainer = document.getElementById('chatContainer');
            const lessonContent = document.getElementById('lessonContent');
            const welcomeContent = document.getElementById('welcomeContent');
            
            if (currentView === 'chat') {
                chatToggle.textContent = 'Open Chat Assistant';
                chatToggle.classList.remove('active');
                chatContainer.classList.remove('active');
                
                if (currentLessonId) {
                    lessonContent.classList.add('active');
                    currentView = 'lesson';
                } else {
                    welcomeContent.style.display = 'block';
                    currentView = 'welcome';
                }
                
                document.getElementById('contentTitle').textContent = currentLessonId ? 
                    document.querySelector(`[data-lesson-id="${currentLessonId}"]`).textContent : 
                    'Welcome to Python Mastery';
            } else {
                chatToggle.textContent = 'Close Chat';
                chatToggle.classList.add('active');
                chatContainer.classList.add('active');
                lessonContent.classList.remove('active');
                welcomeContent.style.display = 'none';
                
                document.querySelectorAll('.lesson-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                document.getElementById('contentTitle').textContent = 'Chat Assistant';
                currentView = 'chat';
                
                setTimeout(() => {
                    const messages = document.getElementById('chatMessages');
                    messages.scrollTop = messages.scrollHeight;
                }, 100);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const message = input.value.trim();
            
            if (!message || isLoading) return;
            
            isLoading = true;
            sendButton.disabled = true;
            
            addMessage(message, 'user');
            input.value = '';
            
            const loadingId = Date.now();
            addMessage('<div class="loading">Thinking</div>', 'assistant', loadingId);
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: message })
                });
                
                const data = await response.json();
                
                removeMessage(loadingId);
                addMessage(data.content, 'assistant');
            } catch (error) {
                console.error('Error sending message:', error);
                removeMessage(loadingId);
                addMessage('Sorry, there was an error processing your request.', 'assistant');
            } finally {
                isLoading = false;
                sendButton.disabled = false;
                input.focus();
            }
        }

        function addMessage(content, sender, id) {
            const messages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (id) messageDiv.dataset.messageId = id;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = content;
            
            messageDiv.appendChild(bubble);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeMessage(id) {
            const message = document.querySelector(`[data-message-id="${id}"]`);
            if (message) message.remove();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeIcon').textContent = '🌙';
                document.getElementById('themeText').textContent = 'Dark Mode';
            }
            
            loadLessons();
        });
    </script>
</body>
</html>
